name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Find project folder
        run: |
          DIR=$(dirname "$(find . -name package.json -not -path '*/node_modules/*' | head -1)")
          echo "APP_DIR=$DIR" >> $GITHUB_ENV
          echo "Project folder: $DIR"
          ls -la "$DIR" "$DIR/www" "$DIR/assets"

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Install packages
        working-directory: ${{ env.APP_DIR }}
        run: npm install

      - name: Add Android
        working-directory: ${{ env.APP_DIR }}
        run: npx cap add android

      - name: Make icons (optional)
        continue-on-error: true
        working-directory: ${{ env.APP_DIR }}
        run: npx capacitor-assets generate --android --iconBackgroundColor '#0e1b2a' --splashBackgroundColor '#0e1b2a'

      - name: Sync
        working-directory: ${{ env.APP_DIR }}
        run: npx cap sync android

      - name: Build APK
        working-directory: ${{ env.APP_DIR }}/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: LiveTV-apk
          path: ${{ env.APP_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk
